<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hello Score</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    background: #111827;
    color: #f9fafb;
  }
  #score {
    font-size: 3rem;
    font-weight: 700;
  }
  button {
    font-size: 1.5rem;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #4f46e5;
  }
</style>
</head>
<body>
  <div id="score">Score: 0</div>
  <button id="btn-hello">Hello</button>
  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('btn-hello').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = `Score: ${score}`;
    });
  </script>
</body>
</html>
