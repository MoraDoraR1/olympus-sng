name: Deploy Cloudflare Worker (backend + frontend)

# workers/(백엔드) 또는 정적 프론트(index.html/game.js/style.css/data)가 main에 반영되면
# 자동 배포. 수동으로도 Actions 탭에서 "Run workflow"로 바로 돌릴 수 있게 workflow_dispatch도
# 열어둔다.
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "index.html"
      - "game.js"
      - "style.css"
      - "data/**"
      - ".assetsignore"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID는 wrangler가 인식하는 표준 환경변수라
    # 별도 액션 없이 그대로 노출해주면 `npx wrangler` 명령들이 자동으로 인증한다.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # D1 스키마 변경(새 마이그레이션 파일 추가)도 배포와 함께 실제 DB에 반영한다.
      # 이미 적용된 마이그레이션은 건너뛰므로 매번 실행해도 안전하다.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply olympus-sng-db --remote

      - name: Deploy Worker (backend + static frontend)
        run: npx wrangler deploy
