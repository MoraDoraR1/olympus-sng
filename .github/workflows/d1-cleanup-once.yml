name: One-off D1 cleanup (deploycheck1 test account)

# 배포 확인용으로 만들었던 테스트 계정(deploycheck1, id=4)을 실제 D1에서 지우기 위한
# 일회성 작업. 사용 후 이 워크플로 파일 자체를 삭제한다(임의 SQL 실행 창구를 레포에
# 남겨두지 않기 위함).
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Delete deploycheck1 (id=4) and related rows
        run: |
          npx wrangler d1 execute olympus-sng-db --remote --command "DELETE FROM pvp_missions WHERE origin_player_id = 4 OR target_player_id = 4"
          npx wrangler d1 execute olympus-sng-db --remote --command "DELETE FROM player_items WHERE player_id = 4"
          npx wrangler d1 execute olympus-sng-db --remote --command "DELETE FROM world_tiles WHERE player_id = 4"
          npx wrangler d1 execute olympus-sng-db --remote --command "DELETE FROM game_states WHERE player_id = 4"
          npx wrangler d1 execute olympus-sng-db --remote --command "DELETE FROM players WHERE id = 4 AND nickname = 'deploycheck1'"
          npx wrangler d1 execute olympus-sng-db --remote --command "SELECT COUNT(*) AS remaining FROM players WHERE id = 4"
