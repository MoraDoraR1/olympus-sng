name: Deploy Cloudflare Worker (backend + frontend)

# workers/(백엔드) 또는 정적 프론트(index.html/game.js/style.css/data)가 main에 반영되면
# 자동 배포. 수동으로도 Actions 탭에서 "Run workflow"로 바로 돌릴 수 있게 workflow_dispatch도
# 열어둔다.
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "index.html"
      - "game.js"
      - "style.css"
      - "data/**"
      - ".assetsignore"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID는 wrangler가 인식하는 표준 환경변수라
    # 별도 액션 없이 그대로 노출해주면 `npx wrangler` 명령들이 자동으로 인증한다.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      # wrangler 4.x는 Node 22 이상을 요구한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # wrangler.jsonc의 database_id는 저장소에 실제 값이 커밋되어 있지 않다(플레이스홀더
      # REPLACE_WITH_REAL_D1_DATABASE_ID) — 이 값은 비밀값은 아니지만 로컬 세션에서는
      # 실제 Cloudflare 계정 정보를 조회할 방법이 없어서, CI가 매번 자기 자격증명으로
      # 직접 조회(없으면 생성)해서 체크아웃된 파일에만 채워 넣는다(커밋하지 않음).
      - name: Resolve D1 database_id
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const list = JSON.parse(d || '[]');
              const db = list.find(x => x.name === 'olympus-sng-db');
              console.log(db ? db.uuid : '');
            });
          ")
          if [ -z "$DB_ID" ]; then
            echo "olympus-sng-db가 없어 새로 생성합니다."
            npx wrangler d1 create olympus-sng-db
            DB_ID=$(npx wrangler d1 list --json | node -e "
              let d='';
              process.stdin.on('data', c => d += c);
              process.stdin.on('end', () => {
                const list = JSON.parse(d || '[]');
                const db = list.find(x => x.name === 'olympus-sng-db');
                console.log(db ? db.uuid : '');
              });
            ")
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::olympus-sng-db의 database_id를 확인하지 못했습니다."
            exit 1
          fi
          sed -i "s/REPLACE_WITH_REAL_D1_DATABASE_ID/$DB_ID/" wrangler.jsonc

      # D1 스키마 변경(새 마이그레이션 파일 추가)도 배포와 함께 실제 DB에 반영한다.
      # 이미 적용된 마이그레이션은 건너뛰므로 매번 실행해도 안전하다.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply olympus-sng-db --remote

      # 로그인 토큰(JWT) 서명용 비밀값 — CLI 인자로 넘기거나 로그에 찍히면 안 되므로
      # stdin으로 흘려보낸다(문서화된 CI 패턴). 이미 같은 값이 설정돼 있어도 매번 덮어써
      # 안전하다. GitHub Secrets에 JWT_SECRET이 없으면 이 단계는 실패한다 — 최초 1회
      # `node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"`로 값을
      # 만들어 저장소 Settings → Secrets and variables → Actions에 등록해야 한다.
      - name: Set JWT_SECRET
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET

      - name: Deploy Worker (backend + static frontend)
        run: npx wrangler deploy
