name: Deploy Firebase backend

# functions/, firestore.rules, firestore.indexes.json, data/heroes.js(영웅 데이터,
# functions가 배포 전 predeploy 훅으로 복사해 씀) 중 하나라도 main에 반영되면 자동 배포.
# 수동으로도 Actions 탭에서 "Run workflow"로 바로 돌릴 수 있게 workflow_dispatch도 열어둔다.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - "data/heroes.js"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root tooling (firebase-tools)
        run: npm install

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      # 서비스 계정 키로 인증한다 — firebase-tools는 GOOGLE_APPLICATION_CREDENTIALS가
      # 설정되어 있으면 별도 `firebase login` 없이 그 자격으로 배포한다.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      # 배포 대상 프로젝트는 .firebaserc의 "default" 값을 그대로 쓴다(로컬 배포와 동일 동작).
      - name: Deploy functions + firestore rules/indexes
        run: npx firebase deploy --only functions,firestore --non-interactive
