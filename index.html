<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>올림포스 도시</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">🏛️ 올림포스 도시</div>
    <div class="resources">
      <div class="res" data-res="food"><span class="icon">🌾</span><span class="amt" id="res-food">0</span><span class="cap">/<span id="cap-food">0</span></span><span class="rate" id="rate-food">+0.0/s</span></div>
      <div class="res" data-res="wood"><span class="icon">🪵</span><span class="amt" id="res-wood">0</span><span class="cap">/<span id="cap-wood">0</span></span><span class="rate" id="rate-wood">+0.0/s</span></div>
      <div class="res" data-res="stone"><span class="icon">🪨</span><span class="amt" id="res-stone">0</span><span class="cap">/<span id="cap-stone">0</span></span><span class="rate" id="rate-stone">+0.0/s</span></div>
      <div class="res" data-res="gold"><span class="icon">🪙</span><span class="amt" id="res-gold">0</span><span class="rate" id="rate-gold">+0.0/s</span></div>
      <div class="res stat" title="원정 부대 강화(방어탑)"><span class="icon">🛡️</span><span class="amt" id="defense-score">+0%</span></div>
      <div class="res stat"><span class="icon">🪖</span><span class="amt" id="troop-count">0</span></div>
    </div>
    <div class="topbar-actions">
      <button id="btn-worldmap">🗺️ 월드맵</button>
      <button id="btn-army">⚔️ 군대</button>
      <button id="btn-heroes">🦸 보유 영웅</button>
      <button id="btn-codex">📖 영웅 도감</button>
      <button id="btn-help">📖 설명서</button>
      <button id="btn-end-game" title="게임 종료">🚪 종료</button>
      <button id="btn-reset-game" title="게임 데이터 초기화">↺</button>
    </div>
  </header>

  <div class="kingdom-label" id="kingdom-label">🗺️ 왕국을 둘러싼 야생 지역</div>
  <div class="kingdom-stage" id="kingdom-stage">
    <div class="monster-grid" id="monster-grid"></div>
    <div class="wall-frame" id="wall-frame">
      <span class="wall-badge" id="wall-badge"></span>
      <div class="board-wrap"><main id="board"></main></div>
    </div>
  </div>

  <!-- 월드맵 화면(모달이 아닌 화면 전체 전환) -->
  <div class="screen" id="screen-worldmap" hidden>
    <div class="worldmap-header">
      <h2>🗺️ 월드맵 — 레벨 1~20 성채</h2>
      <button id="btn-back-city">🏠 도시로 돌아가기</button>
    </div>
    <div class="worldmap-field" id="worldmap-field"></div>
  </div>

  <!-- 타이틀 화면 -->
  <div class="screen screen-title" id="screen-title">
    <div class="title-card">
      <div class="title-logo">🏛️ 올림포스 도시</div>
      <p class="title-tagline">신들이 지켜보는 땅에, 첫 도시를 세운다.</p>
      <button id="btn-start-game">▶ 게임 시작</button>
    </div>
  </div>

  <!-- 종료 화면 -->
  <div class="screen screen-title" id="screen-outro" hidden>
    <div class="title-card">
      <div class="title-logo">🏛️ 올림포스 도시</div>
      <p class="title-tagline">플레이해주셔서 감사합니다.<br>진행 상황이 저장되었습니다.<br>이제 이 탭을 닫으셔도 됩니다.</p>
    </div>
  </div>

  <div id="toast-layer"></div>

  <!-- 건물 상세/배치 모달 -->
  <div class="modal-overlay" id="modal-building" hidden>
    <div class="modal modal-xwide">
      <button class="modal-close" data-close>✕</button>
      <div id="building-modal-body"></div>
    </div>
  </div>

  <!-- 설명서 모달 -->
  <div class="modal-overlay" id="modal-help" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close>✕</button>
      <div id="help-modal-body"></div>
    </div>
  </div>

  <!-- 보유 영웅 모달 -->
  <div class="modal-overlay" id="modal-heroes" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close>✕</button>
      <h2>🦸 보유 영웅</h2>
      <div class="codex-grid" id="heroes-grid"></div>
      <div id="heroes-detail"></div>
    </div>
  </div>

  <!-- 여관 모달 -->
  <div class="modal-overlay" id="modal-tavern" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close>✕</button>
      <h2>🍺 여관 — 신탁이 보낸 영웅들</h2>
      <div class="tavern-meta">
        <div class="tavern-timer">
          <svg viewBox="0 0 44 44" class="timer-ring">
            <circle cx="22" cy="22" r="19" class="ring-bg"></circle>
            <circle cx="22" cy="22" r="19" class="ring-fg" id="tavern-ring"></circle>
          </svg>
          <span id="tavern-timer-text">5:00</span>
        </div>
        <button id="btn-tavern-reset">🔄 즉시 초기화 (<span id="tavern-reset-cost">0</span>🪙)</button>
      </div>
      <div class="tavern-meta-extra" id="tavern-meta-extra"></div>
      <div class="tavern-grid" id="tavern-grid"></div>
    </div>
  </div>

  <!-- 몬스터 공격 모달 -->
  <div class="modal-overlay" id="modal-monster" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close>✕</button>
      <div id="monster-modal-body"></div>
    </div>
  </div>

  <!-- 군대 편성 모달 -->
  <div class="modal-overlay" id="modal-army" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close>✕</button>
      <div id="army-modal-body"></div>
    </div>
  </div>

  <!-- 도감 모달 -->
  <div class="modal-overlay" id="modal-codex" hidden>
    <div class="modal modal-wide">
      <button class="modal-close" data-close>✕</button>
      <h2>📖 영웅 도감 <span id="codex-progress"></span></h2>
      <div class="codex-filters" id="codex-filters"></div>
      <div class="codex-grid" id="codex-grid"></div>
      <div id="codex-detail"></div>
    </div>
  </div>

  <script src="data/heroes.js"></script>
  <script src="game.js?v=7"></script>
</body>
</html>
